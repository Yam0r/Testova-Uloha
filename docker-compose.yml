version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: testova-uloha-db
    environment:
      POSTGRES_DB: TestovaUloha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: testova-uloha-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/TestovaUloha